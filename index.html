// ============================================
// v42: 매장 확인 팝업 시스템 (발급 직전 1회 체크)
// ============================================
// sessionStorage에 매장코드 저장 → 같은 세션에선 1회만 확인
// 매장 변경 시 자동 초기화 (setCurrentBranchCode에서 처리)
const SC_STORAGE_KEY = 'zerolab_store_confirmed';

function isStoreConfirmedThisSession() {
  try {
    const saved = sessionStorage.getItem(SC_STORAGE_KEY);
    if (!saved) return false;
    return saved === getCurrentBranchCode();
  } catch(e) { return false; }
}

function markStoreConfirmed() {
  try { sessionStorage.setItem(SC_STORAGE_KEY, getCurrentBranchCode()); } catch(e) {}
}

function clearStoreConfirmation() {
  try { sessionStorage.removeItem(SC_STORAGE_KEY); } catch(e) {}
}

// 핵심 래퍼: 발급 직전에 매장 확인 (이미 확인됐으면 그대로 진행)
// 사용: withStoreConfirm(() => { /* 발급 로직 */ })
function withStoreConfirm(callback) {
  if (typeof callback !== 'function') return;
  if (isStoreConfirmedThisSession()) {
    callback();
    return;
  }
  openStoreConfirmModal(callback);
}

function openStoreConfirmModal(onConfirm) {
  const overlay = document.getElementById('sc-overlay');
  if (!overlay) {
    // 모달이 없으면 안전 차원에서 바로 진행
    if (typeof onConfirm === 'function') onConfirm();
    return;
  }
  const branch = getCurrentBranch();
  // 매장 정보 주입
  const nameEl = document.getElementById('sc-store-name');
  const addrEl = document.getElementById('sc-store-addr');
  const hoursEl = document.getElementById('sc-store-hours');
  const imgEl = document.getElementById('sc-store-img');
  if (nameEl) nameEl.textContent = branch.name;
  if (addrEl) addrEl.textContent = branch.address;
  if (hoursEl) hoursEl.textContent = branch.hours || '연중무휴 24시간';
  if (imgEl && typeof ZL_ASSETS !== 'undefined') imgEl.src = ZL_ASSETS.logoCircle;

  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));

  const close = () => {
    overlay.classList.remove('open');
    setTimeout(() => { overlay.style.display = 'none'; }, 250);
  };

  // 기존 핸들러 제거 (재오픈 시 중복 방지)
  const confirmBtn = document.getElementById('sc-confirm-btn');
  const changeBtn = document.getElementById('sc-change-btn');
  if (confirmBtn) {
    const newConfirm = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
    newConfirm.addEventListener('click', () => {
      markStoreConfirmed();
      close();
      setTimeout(() => { if (typeof onConfirm === 'function') onConfirm(); }, 200);
    });
  }
  if (changeBtn) {
    const newChange = changeBtn.cloneNode(true);
    changeBtn.parentNode.replaceChild(newChange, changeBtn);
    newChange.addEventListener('click', () => {
      close();
      setTimeout(() => {
        if (typeof openBranchSelector === 'function') openBranchSelector();
      }, 280);
    });
  }
  // 배경 클릭 시 닫기 (취소로 간주, 콜백 미실행)
  const newOverlay = overlay.cloneNode(false);
  // 위 cloneNode 하면 모달 사라지므로 cloneNode 안 하고 직접 핸들러만 갱신
  overlay.onclick = (e) => {
    if (e.target.id === 'sc-overlay') close();
  };
}

function formatDate(iso) {
  const d = new Date(iso);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  return `${d.getFullYear()}.${mm}.${dd} · ${hh}:${min}`;
}

function formatKakaoTime() {
  const d = new Date();
  const ampm = d.getHours() < 12 ? '오전' : '오후';
  let h = d.getHours() % 12; if (h === 0) h = 12;
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${ampm} ${h}:${m}`;
}

function maskName(name) {
  if (!name) return '회원';
  if (name.length <= 1) return name;
  return name[0] + '*'.repeat(name.length - 1);
}

function ageGroup(age) {
  if (age < 20) return 'teen';
  if (age < 30) return '20s';
  if (age < 40) return '30s';
  return '40s+';
}

// === v7: 매장 단골 회원 정의 ===
// 정의: 카톡 연동 + 그 매장에서 1회 이상 쿠폰 사용한 회원
// 다른 지역 회원이 점주 매장에서 카톡 받지 않게 하는 핵심 정책
function isStoreMember(member, branchCode) {
  branchCode = branchCode || BRANCH.code;
  if (!member || !member.kakaoConnected) return false;
  if (!member.usageHistory || member.usageHistory.length === 0) return false;
  return member.usageHistory.some(h => h.branchCode === branchCode);
}
function getStoreMembers(branchCode) {
  branchCode = branchCode || BRANCH.code;
  return MEMBERS.filter(m => isStoreMember(m, branchCode));
}
function getStoreVisitCount(member, branchCode) {
  branchCode = branchCode || BRANCH.code;
  if (!member.usageHistory) return 0;
  return member.usageHistory.filter(h => h.branchCode === branchCode).length;
}

// 회원이 캠페인을 받을 수 있는지 판단
function canClaimCampaign(member, campaign) {
  if (!member) return false;
  // 이미 받았으면 불가
  if ((member.receivedCampaigns || []).includes(campaign.id)) return false;
  // pushOnly 캠페인이면 푸시 받은 회원만
  if (campaign.pushOnly) {
    return (campaign.pushedTo || []).includes(member.phone);
  }
  return true;
}

// 회원이 가진 푸시 캠페인 (아직 안 받은 것만)
function getPushedCampaignsForMember(member) {
  if (!member) return [];
  return CAMPAIGNS.filter(c =>
    c.active && c.pushOnly &&
    (c.pushedTo || []).includes(member.phone) &&
    !(member.receivedCampaigns || []).includes(c.id)
  );
}

// 쿠폰 쿨다운 조회/설정
function getCooldownStore() {
  if (state.member) {
    if (!state.member.couponCooldowns) state.member.couponCooldowns = {};
    return state.member.couponCooldowns;
  }
  return guestSession.couponCooldowns;
}
function getCouponCooldown(campaignId) {
  const store = getCooldownStore();
  if (!store) return 0;
  const unlockAt = store[campaignId];
  if (!unlockAt) return 0;
  const remaining = unlockAt - Date.now();
  if (remaining <= 0) {
    delete store[campaignId];
    return 0;
  }
  return remaining;
}
function setCouponCooldown(campaignId) {
  const store = getCooldownStore();
  if (!store) return;
  store[campaignId] = Date.now() + (COOLDOWN_SECONDS * 1000);
}
function formatCooldown(ms) {
  const totalSec = Math.ceil(ms / 1000);
  const hours = Math.floor(totalSec / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (hours > 0) {
    return `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }
  return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}
function hasActiveCooldowns() {
  const store = getCooldownStore();
  if (!store) return false;
  return Object.keys(store).some(id => getCouponCooldown(id) > 0);
}

  recordIssuance(member, campaign, serial) {
    if (!member || !campaign) return;
    if (!member.receivedCampaignsMeta) member.receivedCampaignsMeta = {};
    const validMin = campaign.validMin || 30;
    const now = Date.now();
    member.receivedCampaignsMeta[campaign.id] = {
      issuedAt: new Date(now).toISOString(),
      expiresAt: new Date(now + validMin * 60 * 1000).toISOString(),
      serial: serial,
      issuedBranchName: BRANCH.name,
      issuedBranchCode: BRANCH.code,
    };
  },
  // v45: 친구 초대 공유 (Web Share API + 클립보드 폴백)
  // 데모 단계: 클릭만으로 카운트 +1 (실제 가입 추적은 M3 백엔드)
  shareReferral(member) {
    if (!member) return Promise.resolve({ success: false, reason: 'no-member' });
    // 익명화 ref: 매장코드 + phone 끝 4자리 (M3에서 정식 회원 ID로 교체)
    const phoneTail = (member.phone || '').slice(-4);
    const ref = `${member.signupBranch || BRANCH.code}-${phoneTail}`;
    const storeCode = BRANCH.code;
    const shareUrl = `https://app.zerolab.kr/?store=${encodeURIComponent(storeCode)}&ref=${encodeURIComponent(ref)}`;
    const shareText = `ZERO 연구소 무인편의점\n카톡으로 1초 가입하면 즉시 쿠폰 받기!`;
    const shareData = {
      title: 'ZERO 연구소',
      text: shareText,
      url: shareUrl,
    };

    // 1순위: Web Share API (모바일 네이티브 공유 시트)
    if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
      return navigator.share(shareData)
        .then(() => ({ success: true, method: 'native', url: shareUrl }))
        .catch(err => {
          // 사용자가 취소한 경우 (AbortError)는 실패로 카운트 X
          if (err && err.name === 'AbortError') {
            return { success: false, reason: 'cancelled' };
          }
          // 그 외 에러 → 클립보드 폴백
          return this._copyToClipboard(shareUrl + '\n' + shareText)
            .then(() => ({ success: true, method: 'clipboard', url: shareUrl }));
        });
    }

    // 2순위: 클립보드 복사 폴백 (PC / 데스크탑 브라우저)
    return this._copyToClipboard(shareUrl + '\n' + shareText)
      .then(() => ({ success: true, method: 'clipboard', url: shareUrl }))
      .catch(() => ({ success: false, reason: 'clipboard-failed', url: shareUrl }));
  },
  _copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // Legacy 폴백 (구형 브라우저)
    return new Promise((resolve, reject) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand failed'));
      } catch (e) { reject(e); }
    });
  },
  // 본사 - 새 캠페인 만들고 타겟에게 푸시
  createPushCampaign(draft, targetPhones) {
    const id = 'P' + Math.floor(Math.random() * 9000 + 1000);
    // v4: 사용기간 모드 → 종료일까지 남은 분으로 validMin 계산 (호환용)
    let validMin = 9999;
    if (draft.endDate) {
      const endTs = new Date(draft.endDate + 'T23:59:59').getTime();
      const nowTs = Date.now();
      validMin = Math.max(60, Math.floor((endTs - nowTs) / 60000));
    }
    const newCampaign = {
      id: id,
      name: draft.name,
      discount: parseInt(draft.discount),
      validMin: validMin,
      // v4: POS 양식 필드
      startDate: draft.startDate || '',
      endDate: draft.endDate || '',
      minOrderAmount: draft.minOrderAmount || 0,
      maxDiscountAmount: draft.maxDiscountAmount || 0,
      type: 'member',
      active: true,
      pushOnly: true,
      totalSerials: (draft.serialFile && draft.serialFile.registered) || 999,
      usedSerials: 0,
      pushedTo: [...targetPhones],
      createdAt: new Date().toISOString(),
    };
    CAMPAIGNS.push(newCampaign);
    return newCampaign;
  },
};

// ============================================
function getTargetMembers(target, subFilter, baseCouponId) {
  // v7: 점주는 자기 매장 단골만 (1회 이상 그 매장에서 쿠폰 사용 회원)
  // 본사 모드는 추후 별도 함수 (M2 hq.zerolab.kr)
  let result = getStoreMembers(BRANCH.code);
  if (target === 'gender' && subFilter) {
    result = result.filter(m => m.gender === subFilter);
  } else if (target === 'age' && subFilter) {
    result = result.filter(m => ageGroup(m.age) === subFilter);
  } else if (target === 'received' && baseCouponId) {
    result = result.filter(m => (m.receivedCampaigns || []).includes(baseCouponId));
  } else if (target === 'not-received' && baseCouponId) {
    result = result.filter(m => !(m.receivedCampaigns || []).includes(baseCouponId));
  }
  // v45: 카톡 수신 거부 회원 자동 제외 (정보통신망법 50조 / 본사 카톡 비용 절감)
  // kakaoMarketingOptIn === false 만 제외 (undefined/true는 동의로 간주 — 기존 회원 호환)
  result = result.filter(m => m.kakaoMarketingOptIn !== false);
  return result;
}

function render() {
  const app = document.getElementById('app');

  // welcome 화면에서는 body 하단의 mode-toggle을 숨김 (welcome 안에 별도 토글이 있어 ID 충돌 방지)
  const bodyToggle = document.querySelector('body > .mode-toggle');
  if (bodyToggle) {
    if (state.mode !== 'admin' && state.screen === 'welcome') {
      bodyToggle.style.display = 'none';
    } else {
      bodyToggle.style.display = '';
    }
  }

  const toggleBtn = bodyToggle && bodyToggle.style.display !== 'none' ? bodyToggle : null;

  // Mode toggle 표시 (body 토글이 보일 때만)
  if (toggleBtn) {
    if (state.mode === 'admin') {
      toggleBtn.textContent = '👤 손님 화면';
      toggleBtn.classList.add('admin');
    } else {
      toggleBtn.textContent = '🔧 점주 화면';
      toggleBtn.classList.remove('admin');
    }
  }

  if (state.mode === 'admin') {
    app.innerHTML = renderAdmin();
  } else if (state.screen === 'welcome') app.innerHTML = renderWelcome();
  else if (state.screen === 'main') app.innerHTML = renderMain();
  else if (state.screen === 'mypage') app.innerHTML = renderMypage();
  else if (state.screen === 'coupon') app.innerHTML = renderCoupon();
  else if (state.screen === 'sending') app.innerHTML = renderSending();
  else if (state.screen === 'success') app.innerHTML = renderSuccess();
  else if (state.screen === 'used') app.innerHTML = renderResult('used');
  else if (state.screen === 'expired') app.innerHTML = renderResult('expired');
  bind();
}

// 쿠폰 티켓 (v5 디자인 - 사진과 동일 비율 + 절취선 동그라미)
function renderV5Ticket(c) {
  const isMember = c.type === 'member';
  const remaining = c.totalSerials - c.usedSerials;
  const validText = c.validMin >= 1440 ? `${Math.floor(c.validMin/1440)}일 유효`
    : c.validMin >= 60 ? `${Math.floor(c.validMin/60)}시간 유효`
    : `${c.validMin}분 유효`;

  return `
    <div class="v5-ticket" data-id="${c.id}">
      <div class="v5-ticket-left">
        <div class="v5-ticket-percent">${c.discount}<span class="pct-sign">%</span></div>
        <div class="v5-ticket-off">OFF</div>

      <div class="v5-ticket-right">

        <div class="v5-ticket-name">${c.name}</div>

          <span class="v5-ticket-meta-item">⏱ ${validText}</span>

    el.addEventListener('click', () => {

          openKakaoConnectModal(c.discount);
        } else {
          const alreadyClaimed = (state.member.receivedCampaigns || []).includes(c.id);
          if (alreadyClaimed) { toast('이미 발급받은 쿠폰입니다'); return; }

            state.member.receivedCampaigns = state.member.receivedCampaigns || [];
            state.member.receivedCampaigns.push(c.id);
            api.recordIssuance(state.member, c, serial);  // v45: 쿠폰함 메타데이터
            persistMember(state.member);

function openBranchSelector() {
  const existing = document.getElementById('branch-modal-overlay');
  if (existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.innerHTML = renderBranchSelectorModal();
  document.body.appendChild(wrap.firstElementChild);

  // 애니메이션 트리거
  requestAnimationFrame(() => {
    document.getElementById('branch-modal-overlay')?.classList.add('open');
  });

  // 닫기
  const close = () => {
    const overlay = document.getElementById('branch-modal-overlay');
    if (overlay) {
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 250);
    }
  };
  document.getElementById('branch-modal-close')?.addEventListener('click', close);
  document.getElementById('branch-modal-overlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'branch-modal-overlay') close();
  });

  // 매장 선택
  document.querySelectorAll('.branch-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.getAttribute('data-code');
      if (code === getCurrentBranchCode()) {
        close();
        return;
      }
      setCurrentBranchCode(code);
      const branch = BRANCHES.find(b => b.code === code);
      // v45: 매장 변경 시각 효과 (헤더 깜빡임 + 변경됨 배지)
      // 매장 오발급 사고 방지 - 사용자가 매장이 바뀐 걸 확실히 인지하게
      state.branchJustChangedAt = Date.now();
      if (state.branchChangeFlashTimer) {
        clearTimeout(state.branchChangeFlashTimer);
      }
      state.branchChangeFlashTimer = setTimeout(() => {
        state.branchJustChangedAt = null;
        state.branchChangeFlashTimer = null;
        try { render(); } catch(e) {}
      }, 3200);  // CSS 배지 fadeout 완료(3초) + 여유 200ms
      try { toast(`📍 ${branch.name}으로 변경되었습니다 ✓`); } catch(e) {}
      close();
      // 페이지 다시 렌더링
      setTimeout(() => { try { render(); } catch(e) {} }, 280);
    });
  });

  // 검색 필터
  document.getElementById('branch-search-input')?.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.branch-item').forEach(it => {
      const text = it.innerText.toLowerCase();
      it.style.display = text.includes(q) ? '' : 'none';
    });
    // 빈 지역은 숨기기
    document.querySelectorAll('.branch-region-group').forEach(g => {
      const hasVisible = Array.from(g.querySelectorAll('.branch-item')).some(it => it.style.display !== 'none');
      g.style.display = hasVisible ? '' : 'none';
    });
  });
}

function renderNewsletterSection() {
  const newsletters = getNewsletters();

  const sorted = [...newsletters].sort((a,b) => {
    if (a.pinned !== b.pinned) return b.pinned - a.pinned;
    return (b.publishedAt || '').localeCompare(a.publishedAt || '');
  });
  const display = sorted.slice(0, 5);

  return `
    <div class="newsletter-section">
      <div class="newsletter-section-title">
        📰 제로연구소 소식 <span class="news-count">${display.length}</span>
      </div>
      <div class="newsletter-list">
        ${display.map(n => {
          const tagLabel = { product: '상품', notice: '공지', event: '이벤트', community: '커뮤니티' }[n.tag] || '소식';
          return `
            <div class="newsletter-card ${n.pinned ? 'pinned' : ''}" onclick="openNewsletterDetail('${n.id}')">
              <div class="newsletter-card-tags">
                ${n.pinned ? '<span class="newsletter-card-pin">📌 고정</span>' : ''}
                <span class="newsletter-card-tag ${n.tag || 'product'}">${tagLabel}</span>
                ${n.badge ? `<span class="newsletter-card-badge">${n.badge}</span>` : ''}
              </div>
              <div class="newsletter-card-title">${n.title}</div>
              <div class="newsletter-card-summary">${n.summary}</div>
              <div class="newsletter-card-meta">
                <span>${(n.publishedAt || '').slice(0,10).replace(/-/g, '.')}</span>
                <span class="newsletter-card-cta">자세히 →</span>
              </div>
            </div>

        }).join('')}

function renderCouponCard(c, isMember, isPushed) {
  const remaining = c.totalSerials - c.usedSerials;

  const alreadyClaimed = isMember && (state.member.receivedCampaigns || []).includes(c.id);
  const lockedForGuest = c.type === 'member' && !isMember;
  // 쿨다운: type='all' 쿠폰은 1회 사용 후 N초간 비활성화
  const cooldownMs = c.type === 'all' ? getCouponCooldown(c.id) : 0;
  const inCooldown = cooldownMs > 0;

  let cardClass = '';
  let cardStateAttr = '';

  if (isPushed) {
    cardClass = 'push-new';
  } else if (alreadyClaimed) {
    cardClass = 'already-claimed';
    cardStateAttr = 'data-claimed="true"';
  } else if (inCooldown) {
    cardClass = 'cooldown';

  return `
    <div class="coupon-card ${cardClass}" data-id="${c.id}" ${cardStateAttr}>
      ${isPushed ? `<div class="new-badge">🔔 NEW</div>` : ''}
      <div class="coupon-top">

          <span class="coupon-tag ${isPushed ? 'push' : c.type}">

          <div class="coupon-name">${c.name}</div>
          <div class="coupon-meta">
            <span>⏱ ${c.validMin}분 유효</span>
            ${c.pushOnly ? '<span>👤 한정 발송</span>' : `<span>📦 ${remaining}장 남음</span>`}

        </div>
        <div class="coupon-discount">
          <span class="coupon-discount-num ${lockedForGuest ? 'locked' : ''} ${isPushed ? 'push' : ''}">${c.discount}</span><span class="coupon-discount-percent">%</span>
        </div>
      </div>
      ${!c.pushOnly ? `
        <div class="coupon-progress">
          <div class="coupon-progress-bar"><div class="coupon-progress-fill" style="width: ${pct}%"></div></div>
          <div class="coupon-progress-text">${c.usedSerials}/${c.totalSerials}</div>

function renderBarcode(text) {
  let seed = 0;
  for (let i = 0; i < text.length; i++) seed = (seed * 31 + text.charCodeAt(i)) & 0x7fffffff;
  let bars = '';
  let x = 0;
  let rng = seed;
  while (x < 280) {
    rng = (rng * 1103515245 + 12345) & 0x7fffffff;
    const w = 1 + (rng % 4);
    rng = (rng * 1103515245 + 12345) & 0x7fffffff;
    const isBlack = (rng % 3) > 0;
    if (isBlack) bars += `<rect x="${x}" y="0" width="${w}" height="56" fill="#0A0A0A"/>`;
    x += w + 1;
  }
  return `<svg class="barcode-svg" viewBox="0 0 280 56" preserveAspectRatio="none">${bars}</svg>`;
}

// v45: 만료 시간 표시 (status별 다른 포맷)
function formatExpiresAt(isoStr, status, msLeft) {
  if (status === 'expired') {
    return `${formatDate(isoStr)} 만료`;
  }
  if (status === 'used') {
    return '';  // 사용 완료는 만료 시간 표시 안 함
  }
  // available / urgent: 남은 시간 표시
  if (msLeft === null || msLeft === undefined) return '';
  if (msLeft <= 0) return '만료됨';
  const minLeft = Math.floor(msLeft / 60000);
  const hourLeft = Math.floor(minLeft / 60);
  const dayLeft = Math.floor(hourLeft / 24);
  if (dayLeft >= 1) return `${dayLeft}일 후 만료`;
  if (hourLeft >= 1) return `${hourLeft}시간 후 만료`;
  if (minLeft >= 1) return `${minLeft}분 후 만료`;
  return '곧 만료';
}

function renderMypage() {
  const m = state.member;
  const history = m.usageHistory || [];
  const totalUsed = history.length;
  const memberOnlyUsed = history.filter(h => h.type === 'member').length;
  const allUsed = history.filter(h => h.type === 'all').length;
  const avgDiscount = totalUsed === 0 ? 0 : Math.round(history.reduce((a,h) => a + h.discount, 0) / totalUsed);
  const totalDiscountSum = history.reduce((a,h) => a + h.discount, 0);
  const days = Math.max(1, Math.floor((Date.now() - new Date(m.signupDate).getTime()) / (1000*60*60*24)));

  // v45: 내 쿠폰함 — 회원전용 쿠폰만 (전체가능은 쿨다운 시스템)
  const meta = m.receivedCampaignsMeta || {};
  const usedMemberIds = m.usedMemberCampaigns || [];
  const receivedIds = m.receivedCampaigns || [];
  const now = Date.now();
  const URGENT_THRESHOLD_MS = 24 * 60 * 60 * 1000;  // 24시간

  // 회원전용 쿠폰 + 메타데이터 있는 것만 (기존 회원 호환 위해 메타 없으면 표시 안 함)
  const myCoupons = receivedIds.map(cId => {
    const c = CAMPAIGNS.find(x => x.id === cId);
    if (!c || c.type !== 'member') return null;
    const md = meta[cId];
    if (!md) return null;  // 메타 없으면 = 기존 회원 / 표시 안 함
    const expiresAt = md.expiresAt ? new Date(md.expiresAt).getTime() : null;
    const isUsed = usedMemberIds.includes(cId);
    const isExpired = !isUsed && expiresAt && now > expiresAt;
    const msLeft = expiresAt ? expiresAt - now : null;
    let status;
    if (isUsed) status = 'used';
    else if (isExpired) status = 'expired';
    else if (msLeft !== null && msLeft <= URGENT_THRESHOLD_MS) status = 'urgent';
    else status = 'available';
    return { campaign: c, meta: md, status, expiresAt, msLeft, isUsed };
  }).filter(x => x !== null);

  // 활성 탭 (state.mypageCouponTab 없으면 기본 'active')
  const activeTab = state.mypageCouponTab || 'active';
  const activeCoupons = myCoupons.filter(x => x.status === 'available' || x.status === 'urgent');
  const usedExpiredCoupons = myCoupons.filter(x => x.status === 'used' || x.status === 'expired');
  const displayCoupons = activeTab === 'active' ? activeCoupons : usedExpiredCoupons;

  return `
    <div class="header">
      <div class="header-left">
        <div class="header-branch">📊 마이페이지</div>
        <div class="header-greeting">${maskName(m.kakaoNickname)}님 · 가입 ${days}일째</div>
      </div>
      <button class="back-btn-header" id="back-from-mypage">← 돌아가기</button>
    </div>

    <div class="mypage-content">
      <div class="mypage-stats">
        <div class="big-stat">
          <div class="big-stat-label-top">TOTAL COUPONS USED</div>
          <div><span class="big-stat-num">${totalUsed}</span><span class="big-stat-unit">장</span></div>
          <div class="big-stat-savings">지금까지 누적 <b>${totalDiscountSum}%</b> 할인 받으셨어요 🎉</div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-mini"><div class="stat-mini-num">${memberOnlyUsed}</div><div class="stat-mini-label">★ 회원전용</div></div>
        <div class="stat-mini"><div class="stat-mini-num">${allUsed}</div><div class="stat-mini-label">🎁 전체가능</div></div>
        <div class="stat-mini"><div class="stat-mini-num">${avgDiscount}%</div><div class="stat-mini-label">평균 할인</div></div>
      </div>

      <!-- v45: 내 쿠폰함 (회원전용 쿠폰) -->
      <div class="v45-mycoupons">
        <div class="section-label">
          <div class="section-label-left"><span class="section-icon">🎟️</span><span class="section-title">내 쿠폰함</span></div>
          <div class="section-count">${myCoupons.length}장</div>
        </div>

        <div class="v45-mycoupons-tabs">
          <button class="v45-mycoupons-tab ${activeTab === 'active' ? 'active' : ''}" data-mycoupon-tab="active">
            사용 가능
            <span class="v45-mycoupons-tab-count">${activeCoupons.length}</span>
          </button>
          <button class="v45-mycoupons-tab ${activeTab === 'past' ? 'active' : ''}" data-mycoupon-tab="past">
            지난 쿠폰
            <span class="v45-mycoupons-tab-count">${usedExpiredCoupons.length}</span>
          </button>
        </div>

        ${displayCoupons.length === 0 ? `
          <div class="v45-mycoupons-empty">
            <div class="v45-mycoupons-empty-emoji">📭</div>
            ${activeTab === 'active'
              ? '사용 가능한 쿠폰이 없어요<br/><span style="font-size:11px;">홈에서 회원전용 쿠폰을 받아보세요</span>'
              : '지난 쿠폰 기록이 없어요'}
          </div>
        ` : `
          <div class="v45-mycoupon-list">
            ${displayCoupons.map(item => renderMyCouponCard(item)).join('')}
          </div>
        `}
      </div>

      <!-- v45: 친구 초대 (회원 자연 증식 / 점주 셀링 카드) -->
      <div class="v45-referral-section">
        <div class="v45-referral-card">
          <div class="v45-referral-icon">🎁</div>
          <div class="v45-referral-info">
            <div class="v45-referral-title">친구에게 추천하기</div>
            <div class="v45-referral-sub">
              ${(m.referralCount || 0) > 0
                ? `지금까지 <b>${m.referralCount}회</b> 공유했어요`

            </div>

      </div>

        <div class="section-count">${totalUsed}건</div>
      </div>

      ${history.length === 0 ? `

        </div>
      ` : `
        <div class="history-list">
          ${[...history].reverse().map(h => `
            <div class="history-item">

                <span class="history-tag ${h.type}">${h.type === 'member' ? '★ 회원전용' : '🎁 전체가능'}</span>

                <div class="history-discount"><span>${h.discount}%</span> 할인</div>

            </div>
          `).join('')}
        </div>
      `}

      <!-- v45: 카톡 알림 수신 토글 (정보통신망법 50조 대응)
           위치: 마이페이지 최하단 (보조 영역 visual hierarchy)

// ============================================
// EVENT BIND
// ============================================
function bind() {
  // 모드 토글 - v44: 시연 편의 (sessionStorage 유지, 비번 재입력 X)
  const modeToggles = document.querySelectorAll('#mode-toggle');
  modeToggles.forEach(el => {
    el.onclick = () => {
      state.mode = state.mode === 'admin' ? 'customer' : 'admin';
      if (state.mode === 'admin') {
        stopTimer();
      } else {
        // 점주 → 손님 전환: sessionStorage 인증은 유지 (다시 점주로 갈 때 비번 X)
        // 진짜 로그아웃은 시크릿 모드/브라우저 닫기로
        if (state.screen !== 'welcome' && state.screen !== 'main') state.screen = 'main';
      }
      render();
    };
  });

  if (state.mode === 'admin') {
    bindAdmin();
    return;
  }

  // === 고객 모드 ===
  attachClick('kakao-signup-btn', () => openKakaoConnectModal());
  attachClick('welcome-perk-btn', () => openKakaoConnectModal());
  attachClick('kakao-login-btn', () => openKakaoLoginModal());
  attachClick('guest-btn', () => { state.screen = 'main'; render(); });
  attachClick('branch-selector-btn', () => openBranchSelector());
  // v42: v28 헤더의 매장 영역 클릭 → 매장 선택 모달
  attachClick('v28-top-info', () => openBranchSelector());

  // v45.1: newsletter 슬라이더 - 도트 동기화 + 도트 클릭으로 이동
  (function bindNewsletterSlider() {
    const slider = document.getElementById('v45-newsletter-slider');
    const dotsWrap = document.getElementById('v45-newsletter-dots');
    if (!slider || !dotsWrap) return;
    const dots = dotsWrap.querySelectorAll('.v45-newsletter-dot');
    if (dots.length === 0) return;

    // 스크롤 위치 → active 도트 업데이트 (debounce)
    let scrollTimer = null;
    slider.addEventListener('scroll', () => {
      if (scrollTimer) clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const slideWidth = slider.clientWidth;
        if (slideWidth === 0) return;
        const idx = Math.round(slider.scrollLeft / slideWidth);
        dots.forEach((d, i) => {
          d.classList.toggle('active', i === Math.min(idx, dots.length - 1));
        });
      }, 50);
    });

    // 도트 클릭 → 해당 슬라이드로 이동
    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        const slideWidth = slider.clientWidth;
        slider.scrollTo({ left: i * slideWidth, behavior: 'smooth' });
      });
    });
  })();

  // welcome 화면의 쿠폰 티켓 클릭 → 바로 발급 흐름 진입 (v2/v3 디자인 모두 지원)
  document.querySelectorAll('.hero-ticket, .v3-ticket, .v4-ticket, .v5-ticket').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const c = CAMPAIGNS.find(x => x.id === id);
      if (!c) return;

      // 회원전용 → 카카오 가입 모달
      if (c.type === 'member') {
        openKakaoConnectModal(c.discount);
        return;
      }

      // 전체가능 쿠폰: 쿨다운 체크
      const cooldownMs = getCouponCooldown(c.id);
      if (cooldownMs > 0) {
        toast(`🔒 ${formatCooldown(cooldownMs)} 후에 다시 사용할 수 있어요`);
        return;
      }

      // 시리얼 발급 → 즉시 사용 화면 (v42: 매장 확인 후 진행)
      withStoreConfirm(() => {
        const serial = api.issueSerial(id);
        if (!serial) { toast('재고가 모두 소진되었습니다'); return; }
        state.selectedCampaign = c;
        state.activeSerial = serial;
        state.secondsLeft = c.validMin * 60;
        state.screen = 'coupon';
        startTimer();
        render();
      });
    });
  });
  attachClick('header-signup-btn', () => openKakaoConnectModal());
  attachClick('guest-hook', () => openKakaoConnectModal());
  attachClick('mypage-btn', () => { state.screen = 'mypage'; render(); });
  attachClick('back-from-mypage', () => { state.screen = 'main'; render(); });
  // v45: 카톡 수신 거부 토글 (정보통신망법 50조)
  attachClick('v45-marketing-toggle', () => {
    if (!state.member) return;
    const current = state.member.kakaoMarketingOptIn !== false;
    state.member.kakaoMarketingOptIn = !current;
    persistMember(state.member);
    if (state.member.kakaoMarketingOptIn) {
      toast('💬 카톡 알림 수신을 다시 시작합니다');
    } else {
      toast('🔕 카톡 알림 수신을 거부합니다');
    }
    render();
  });
  // v45: 마이페이지 쿠폰함 탭 전환
  document.querySelectorAll('[data-mycoupon-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.mycouponTab;
      if (tab && tab !== state.mypageCouponTab) {
        state.mypageCouponTab = tab;
        render();
      }
    });
  });
  // v45: 친구 초대 - 공유 버튼 (Web Share API + 클립보드 폴백)
  attachClick('v45-referral-btn', () => {
    if (!state.member) return;
    const btn = document.getElementById('v45-referral-btn');
    if (btn) btn.disabled = true;  // 더블 클릭 방지

    api.shareReferral(state.member).then(result => {
      if (btn) btn.disabled = false;
      if (!result.success) {
        if (result.reason === 'cancelled') return;  // 사용자 취소 = 조용히
        toast('공유에 실패했어요. 다시 시도해주세요');
        return;
      }
      // 성공: 카운트 +1 + 영속화
      state.member.referralCount = (state.member.referralCount || 0) + 1;
      persistMember(state.member);
      // 토스트 (방법별 다른 메시지)
      if (result.method === 'native') {
        toast('🎁 친구에게 공유했어요!');
      } else {
        toast('📋 링크 복사 완료! 카톡으로 친구에게 보내주세요');
      }
      render();  // 카운트 갱신
    }).catch(() => {
      if (btn) btn.disabled = false;
      toast('공유에 실패했어요. 다시 시도해주세요');
    });
  });
  attachClick('back-to-welcome', () => {
    // 회원 상태는 유지하고 처음 화면으로만 이동
    state.screen = 'welcome';
    render();
  });

  // === v28 새 디자인 카드 핸들러 ===
  // 더보기 카드 - 모든 회원전용 쿠폰 모달
  attachClick('v28-member-more', () => openMemberCouponsModal());
  // 회원전용 카드 클릭 (가로 3열 그리드)
  document.querySelectorAll('.v28-member-card').forEach(el => {
    el.addEventListener('click', (e) => {
      const id = el.dataset.campaign;
      const c = CAMPAIGNS.find(x => x.id === id);
      if (!c) return;
      // 회원전용 → 비회원이면 가입 모달, 회원이면 발급 흐름
      const isMember = !!state.member;
      if (!isMember) {
        openKakaoConnectModal(c.discount);
        return;
      }
      // 회원이면 이미 받았는지 확인
      const alreadyClaimed = (state.member.receivedCampaigns || []).includes(c.id);
      if (alreadyClaimed) {
        toast('이미 발급받은 쿠폰입니다');
        return;
      }
      // 발급 (v42: 매장 확인 후 진행)
      withStoreConfirm(() => {
        const serial = api.issueSerial(id);
        if (!serial) { toast('재고가 모두 소진되었습니다'); return; }
        state.member.receivedCampaigns = state.member.receivedCampaigns || [];
        state.member.receivedCampaigns.push(c.id);
        api.recordIssuance(state.member, c, serial);  // v45: 쿠폰함 메타데이터
        persistMember(state.member);  // 받은 쿠폰 영속화
        // 카톡 알림톡 시뮬레이션 후 쿠폰 화면으로
        openKakaoAlimtalkModal(c, serial, () => {
          state.selectedCampaign = c;
          state.activeSerial = serial;
          state.secondsLeft = c.validMin * 60;
          state.screen = 'coupon';
          startTimer();
          render();
        });
      });
    });
  });

  // 전체 사용 가능 쿠폰 받기 버튼
  document.querySelectorAll('.v28-all-card-receive').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.disabled) return;
      const id = btn.dataset.campaign;
      const c = CAMPAIGNS.find(x => x.id === id);
      if (!c) return;
      const cooldownMs = getCouponCooldown(c.id);
      if (cooldownMs > 0) {
        toast(`🔒 ${formatCooldown(cooldownMs)} 후에 다시 사용할 수 있어요`);
        return;
      }
      withStoreConfirm(() => {
        const serial = api.issueSerial(id);
        if (!serial) { toast('재고가 모두 소진되었습니다'); return; }
        state.selectedCampaign = c;
        state.activeSerial = serial;
        state.secondsLeft = c.validMin * 60;
        state.screen = 'coupon';
        startTimer();
        render();
      });
    });
  });

  // 전체 가능 카드 본문 클릭도 같은 동작
  document.querySelectorAll('.v28-all-card').forEach(el => {
    el.addEventListener('click', (e) => {
      // 받기 버튼 자체 클릭은 위에서 stopPropagation 되어 전달 안 옴
      const id = el.dataset.campaign;
      const c = CAMPAIGNS.find(x => x.id === id);
      if (!c) return;
      const cooldownMs = getCouponCooldown(c.id);
      if (cooldownMs > 0) {
        toast(`🔒 ${formatCooldown(cooldownMs)} 후에 다시 사용할 수 있어요`);
        return;
      }
      withStoreConfirm(() => {
        const serial = api.issueSerial(id);
        if (!serial) { toast('재고가 모두 소진되었습니다'); return; }
        state.selectedCampaign = c;
        state.activeSerial = serial;
        state.secondsLeft = c.validMin * 60;
        state.screen = 'coupon';
        startTimer();
        render();
      });
    });

  // 하단 탭바 - 현재는 쿠폰 탭만 active, 다른 탭은 toast로 안내
  document.querySelectorAll('.v28-tabbar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      if (tab === 'coupons') return;  // 현재 탭
      const labels = { home: '홈', 'my-coupons': '마이쿠폰', benefits: '혜택', more: '더보기' };
      toast(`${labels[tab] || tab} 탭은 준비 중입니다`);
    });
  });

  // 푸시 알림 배너 → 푸시 섹션으로 스크롤
  attachClick('push-alert-scroll', () => {
    const el = document.getElementById('push-section');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 쿠폰 카드 클릭
  document.querySelectorAll('.coupon-card').forEach(el => {
    el.addEventListener('click', () => {
      // 이미 받음 → 차단
      if (el.dataset.claimed === 'true') {
        toast('✓ 이미 받으신 쿠폰이에요');
        return;
      }

      // 쿨다운 중 → 차단
      if (el.dataset.cooldown) {
        const ms = getCouponCooldown(el.dataset.cooldown);
        toast(`🔒 ${formatCooldown(ms)} 후에 다시 사용할 수 있어요`);
        return;
      }

      const id = el.dataset.id;
      const c = CAMPAIGNS.find(x => x.id === id);
      if (!c) return;

      // 비회원 + 회원전용 쿠폰 → 카톡 가입 모달
      if (c.type === 'member' && !state.member) {
        openKakaoConnectModal(c.discount);
        return;
      }

      // 회원전용 + 이미 받음 (예외 처리, 대부분은 위 dataset에서 차단됨)
      if (state.member && (state.member.receivedCampaigns || []).includes(c.id)) {
        toast('✓ 이미 받으신 쿠폰이에요');
        return;
      }

      // pushOnly 캠페인인데 푸시 안 받은 회원 (예외 처리)
      if (c.pushOnly && state.member && !c.pushedTo.includes(state.member.phone)) {
        toast('이 쿠폰은 별도 알림 받으신 분만 받을 수 있어요');
        return;
      }

      // 시리얼 발급 (v42: 매장 확인 후 진행)
      withStoreConfirm(() => {
        const serial = api.issueSerial(id);
        if (!serial) { toast('재고가 모두 소진되었습니다'); return; }

        state.selectedCampaign = c;
        state.activeSerial = serial;

        if (c.type === 'all') {
          // 전체가능 → 앱 내 즉시 사용
          state.secondsLeft = c.validMin * 60;
          state.screen = 'coupon';
          startTimer();
          render();
        } else {
          // 회원전용 또는 push → 카톡 발송
          state.screen = 'sending';
          render();
          setTimeout(() => {
            api.recordUsage(state.member, c, serial, 'kakao');
            state.screen = 'success';
            render();
          }, 1800);
        }
      });
    });
  });

  attachClick('back-btn', () => {
    openCancelConfirmModal();
  });
  attachClick('complete-btn', () => {
    stopTimer();
    if (state.member) {
      api.recordUsage(state.member, state.selectedCampaign, state.activeSerial, 'in-app');
    }
    // 전체가능 쿠폰은 사용 후 쿨다운 적용 (회원/비회원 모두)
    if (state.selectedCampaign.type === 'all') {
      setCouponCooldown(state.selectedCampaign.id);
    }
    state.screen = 'used';
    render();
  });
  attachClick('upsell-kakao', () => openKakaoConnectModal());
  attachClick('back-to-main', () => {
    state.activeSerial = null; state.selectedCampaign = null;
    state.screen = 'main'; render();
  });
  attachClick('go-mypage', () => {
    state.activeSerial = null; state.selectedCampaign = null;
    state.screen = 'mypage'; render();
  });
  attachClick('upsell-after-use', () => openKakaoConnectModal());
  attachClick('open-kakao', () => toast('💬 카카오톡 앱이 열립니다 (시뮬레이션)'));
  attachClick('back-to-coupons', () => {
    state.activeSerial = null; state.selectedCampaign = null;
    state.screen = 'main'; render();
  });

  // 메인 화면에 쿨다운 카드가 있으면 카운트다운 시작
  if (state.screen === 'main' && hasActiveCooldowns()) {
    startCooldownTicker();
  }
}

// === 시리얼 엑셀 업로드 시뮬레이션 ===
// 실제 운영에선 서버로 파일 전송 → 검증 → DB 저장 (M3 백엔드에서 구현)
// v6: 시리얼 충전 탭 폐기 → handleSerialFile 함수 제거됨
// 캠페인 신청 시 시리얼 첨부는 handleCampaignSerialFile 사용

// === 캠페인 신청 시리얼 첨부 핸들러 (v3) ===
function handleCampaignSerialFile(file) {
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    try { toast('⚠️ 파일이 너무 큽니다 (최대 5MB)'); } catch(e) {}
    return;
  }

  const validExt = /\.(xlsx|xls|csv)$/i;
  if (!validExt.test(file.name)) {
    try { toast('⚠️ 엑셀 또는 CSV 파일만 가능합니다'); } catch(e) {}
    return;
  }

  // 파일명 + 검증 결과 표시
  const filenameEl = document.getElementById('campaign-serial-filename');
  const hintEl = document.getElementById('campaign-serial-hint');
  const statusEl = document.getElementById('campaign-serial-status');
  const resultEl = document.getElementById('campaign-serial-result');

  if (filenameEl) filenameEl.textContent = `📄 ${file.name}`;
  if (hintEl) hintEl.textContent = '클릭하여 다른 파일 선택';

  // v4: 시뮬레이션 — 실제 POS 양식 (XXXX-XXXX-XXXX-XXXX) 검증 결과
  // 실제로는 서버에서 파일 파싱 + 정규식 검증 + 풀 중복 검사
  const fakeTotal = 200 + Math.floor(Math.random() * 800);
  const fakeFormatErrors = Math.floor(Math.random() * 3);  // 헤더 행 등
  const fakeDuplicates = Math.floor(Math.random() * 8);    // 본사 풀과 중복
  const fakeRegistered = fakeTotal - fakeDuplicates - fakeFormatErrors;

  // state 저장 (캠페인 신청용)
  state.adminDraft.serialFile = { name: file.name, total: fakeTotal, registered: fakeRegistered, duplicates: fakeDuplicates, errors: fakeFormatErrors };

  // 상태 표시 — 쿠폰 발행 수 명확히 (POS와 매칭)
  if (statusEl) {
    statusEl.textContent = `✓ ${fakeRegistered.toLocaleString()}개 등록 가능`;
    statusEl.style.color = '#15803D';
  }

  // 결과 박스 — POS 매칭 안내 강화
  if (resultEl) {
    resultEl.style.display = 'block';
    resultEl.style.background = '#DCFCE7';
    resultEl.style.color = '#15803D';
    resultEl.style.border = '1px solid #86EFAC';
    resultEl.innerHTML = `
      ✅ <b style="font-weight:900;">시리얼 검증 완료</b><br/>
      <span style="font-weight:600;">· 전체: <b>${fakeTotal.toLocaleString()}개</b></span><br/>
      <span style="font-weight:600;">· 등록 가능: <b style="color:#16A34A;font-size:13px;">${fakeRegistered.toLocaleString()}개</b></span>${fakeDuplicates > 0 ? `<br/><span style="font-weight:600;">· 풀 중복 제외: ${fakeDuplicates}개</span>` : ''}${fakeFormatErrors > 0 ? `<br/><span style="font-weight:600;">· 헤더/형식 오류 제외: ${fakeFormatErrors}개</span>` : ''}
      <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #86EFAC;">
        ⚠️ <b style="color:#B45309;">POS 시스템에도 동일한 ${fakeRegistered.toLocaleString()}개 쿠폰을 발행해야 합니다.</b><br/>
        <span style="font-weight:600;color:#15803D;font-size:10.5px;">신청 후 자동 가이드 제공됩니다.</span>
      </div>
    `;
  }

  try { toast(`✅ ${fakeRegistered.toLocaleString()}개 시리얼 첨부 완료`); } catch(e) {}
}

      if (ok) {

          item.style.pointerEvents = 'none';
        }
        try { toast(`✓ 삭제 신청 전송: ${cname}`); } catch(e) {}
      }
    };
  });

  // === 캠페인 신청 탭: 시리얼 첨부 핸들러 (v3) ===
  const campaignSerialZone = document.getElementById('campaign-serial-zone');
  const campaignSerialInput = document.getElementById('campaign-serial-input');
  if (campaignSerialZone && campaignSerialInput) {
    const triggerInput = (e) => { e.stopPropagation(); campaignSerialInput.click(); };
    campaignSerialZone.onclick = triggerInput;
    campaignSerialZone.ondragover = (e) => { e.preventDefault(); campaignSerialZone.style.borderColor = '#1E40DD'; campaignSerialZone.style.background = '#EFF6FF'; };
    campaignSerialZone.ondragleave = () => { campaignSerialZone.style.borderColor = '#D1D5DB'; campaignSerialZone.style.background = '#F9FAFB'; };
    campaignSerialZone.ondrop = (e) => {
      e.preventDefault();
      campaignSerialZone.style.borderColor = '#D1D5DB';
      campaignSerialZone.style.background = '#F9FAFB';
      if (e.dataTransfer.files.length > 0) {
        handleCampaignSerialFile(e.dataTransfer.files[0]);

      if (e.target.files.length > 0) handleCampaignSerialFile(e.target.files[0]);
    };

  // 폼 입력 (성능: 매 키 입력마다 render()를 부르면 커서가 풀리므로 state만 업데이트)
  const nameEl = document.getElementById('admin-name');

  const maxDiscountEl = document.getElementById('admin-maxDiscountAmount');

  // maxDiscountAmount는 v5에서 본사 고정 (제한 없음 = 0)
  if (reasonEl) reasonEl.oninput = (e) => { state.adminDraft.reason = e.target.value; };

  // v38 커스텀 메시지 핸들러
  const customMsgEl = document.getElementById('admin-custom-message');
  if (customMsgEl) {
    customMsgEl.oninput = (e) => {
      state.adminDraft.customMessage = e.target.value;
      updateAdminMsgCost();
      updateAdminPreview();
    };
    // 초기 1회 호출
    updateAdminMsgCost();
  }

  // 타겟 선택
  document.querySelectorAll('.target-option').forEach(el => {
    el.addEventListener('click', (e) => {
      // sub-chip이나 base-coupon 클릭은 별도 처리
      if (e.target.closest('.admin-sub-chip') || e.target.closest('.admin-base-coupon-option')) return;
      state.adminDraft.target = el.dataset.target;
      state.adminDraft.subFilter = null;
      state.adminDraft.baseCoupon = null;
      // 기본값: gender → M, age → 20s 자동선택
      if (state.adminDraft.target === 'gender') state.adminDraft.subFilter = 'M';
      if (state.adminDraft.target === 'age') state.adminDraft.subFilter = '20s';
      if (state.adminDraft.target === 'received' || state.adminDraft.target === 'not-received') {

        if (memberCampList.length > 0) state.adminDraft.baseCoupon = memberCampList[0].id;

  // sub-chip 선택
  document.querySelectorAll('.admin-sub-chip').forEach(el => {
    el.addEventListener('click', (e) => {

  // base-coupon 선택

  // 본사 승인 요청 (점주가 신청)
  attachClick('admin-send-btn', () => sendAdminRequest());
  attachClick('admin-send-btn-qr', () => sendAdminRequest());

// v5: 종류별 검증 분기
function sendAdminRequest() {
    const draft = state.adminDraft;
    const type = draft.campaignType || 'push';

    // 공통 검증
    if (!draft.name) { toast('캠페인 이름을 입력하세요'); return; }
    const discount = parseInt(draft.discount);
    if (!discount || discount < DISCOUNT_POLICY.member.min || discount > DISCOUNT_POLICY.member.max) {
      toast(`회원전용 캠페인은 ${DISCOUNT_POLICY.member.min}~${DISCOUNT_POLICY.member.max}% 범위여야 합니다`);
      return;
    }
    if (!draft.startDate || !draft.endDate) {
      toast('사용기간(시작일~종료일)을 입력해주세요');
      return;
    }
    if (draft.startDate > draft.endDate) {
      toast('종료일이 시작일보다 빨라요');
      return;
    }
    if (!draft.reason || draft.reason.trim().length < 5) {
      toast('신청 사유를 5자 이상 작성해주세요');
      return;
    }
    if (!draft.serialFile) {
      toast('📤 시리얼 엑셀 파일을 첨부해주세요');
      const zone = document.getElementById('campaign-serial-zone');
      if (zone) zone.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // 종류별 추가 검증
    let targetCount = 0;
    if (type === 'push') {
      // push: 타겟 발송 인원 검증
      const targets = getTargetMembers(draft.target, draft.subFilter, draft.baseCoupon);
      if (targets.length === 0) { toast('발송 대상이 없습니다'); return; }
      targetCount = targets.length;
    } else {
      // qr: 시리얼 풀 크기 = 자동 분배 가능 인원
      targetCount = (draft.serialFile && draft.serialFile.registered) || 0;
    }

    showApprovalRequestModal(draft, targetCount);
}

// 입력 시 부분 갱신 (전체 render 안 부르고 미리보기만 업데이트)
function updateAdminPreview() {
  const draft = state.adminDraft;
  const previewName = document.getElementById('preview-name');
  if (previewName) previewName.textContent = draft.name || '(캠페인 이름)';
  const previewDiscount = document.getElementById('preview-discount');
  if (previewDiscount) previewDiscount.innerHTML = `${draft.discount}<span class="kakao-campaign-discount-unit">% 할인</span>`;
  const previewPeriod = document.getElementById('preview-period');
  if (previewPeriod) previewPeriod.textContent = (draft.startDate && draft.endDate) ? `${draft.startDate} ~ ${draft.endDate}` : '미입력';
  const sendBtn = document.getElementById('admin-send-btn');
  if (sendBtn) {
    const discount = parseInt(draft.discount);
    const valid = draft.name && discount >= 10 && discount <= 30 && draft.startDate && draft.endDate;
    sendBtn.disabled = !valid;
  }
  // 미리보기 안에 커스텀 메시지가 있으면 노출 / 없으면 placeholder
  const previewCustom = document.getElementById('preview-custom-msg');
  if (previewCustom) {
    if (draft.customMessage && draft.customMessage.trim()) {
      previewCustom.textContent = draft.customMessage;
      previewCustom.classList.remove('is-placeholder');
    } else {
      previewCustom.innerHTML = '여기에 점주님이 직접 작성한 메시지가 들어갑니다.<br/><span style="font-size:11px;font-weight:500;opacity:0.75;">(아래 카톡 메시지 본문 입력란에 작성)</span>';
      previewCustom.classList.add('is-placeholder');
    }
  }
  // 총 글자수도 같이 갱신 (캠페인명/할인율 등이 바뀌면 총합도 변함)
  if (typeof updateAdminMsgCost === 'function') updateAdminMsgCost();
}

// v38/v39 커스텀 메시지 글자수 + 비용 계산
// === 정확한 카카오 단가 (2026.1.1 시행 기준, VAT 별도) ===
//   - 알림톡: 8원 (정보성만 - 우리 쿠폰 마케팅엔 사용 불가)
//   - 친구톡 텍스트: 15원 (광고/마케팅 가능 - 우리 케이스)
//   - 친구톡 이미지: 18원
//   - 친구톡 와이드: 20원
// 쿠폰 마케팅은 카카오 정책상 친구톡(브랜드메시지) 영역
// 글자수 1,000자까지 동일 단가 (글자수 ≠ 비용)
// 80자 제한은 "가독성/클릭율" 관점의 권장
function updateAdminMsgCost() {
  const draft = state.adminDraft;
  const text = (draft.customMessage || '');
  const len = text.length;

  // 글자수 카운터 (가독성 권장 80자, 한도 1,000자)
  const countEl = document.getElementById('admin-msg-count');
  if (countEl) {
    countEl.textContent = len;
    countEl.style.color = len > 800 ? '#DC2626' : (len > 80 ? '#D97706' : '#1E40DD');
    countEl.style.fontWeight = '900';
  }

  // === v40 총 발송 글자수 계산 ===
  // 자동 영역 (기본 양식): "🎁 새 쿠폰이 도착했어요! 안녕하세요, [매장명]에서 한정 쿠폰을 발송해드립니다."
  const branchName = (typeof BRANCH !== 'undefined' && BRANCH.name) ? BRANCH.name : '나사렛대점';
  const baseTemplate = `🎁 새 쿠폰이 도착했어요! 안녕하세요, ${branchName}에서 한정 쿠폰을 발송해드립니다.`;
  // 시스템 자동: "⏱ 유효시간: 발급 후 [N]분 📍 매장: [매장명]"
  const systemPart = `📅 사용기간: ${draft.startDate || ''} ~ ${draft.endDate || ''} 📍 매장: ${branchName}`;
  // 폼 입력: 캠페인 이름 + 할인율
  const campaignPart = `${draft.name || ''} ${draft.discount || 0}% 할인`;
  // 점주 입력
  const ownerPart = text;

  const totalLen = baseTemplate.length + systemPart.length + campaignPart.length + ownerPart.length;
  const totalEl = document.getElementById('admin-msg-total');
  const totalCounterBox = document.querySelector('.msg-total-counter');
  const readabilityHint = document.getElementById('admin-msg-readability');
  if (totalEl) {
    totalEl.textContent = totalLen.toLocaleString();
  }
  if (totalCounterBox) {
    totalCounterBox.classList.remove('warn', 'danger');
    if (totalLen > 400) totalCounterBox.classList.add('danger');
    else if (totalLen > 250) totalCounterBox.classList.add('warn');
  }
  if (readabilityHint) {
    readabilityHint.classList.remove('warn', 'danger');
    if (totalLen > 400) {
      readabilityHint.textContent = '⚠ 너무 길어요 · 모바일에서 잘릴 수 있음';
      readabilityHint.classList.add('danger');
    } else if (totalLen > 250) {
      readabilityHint.textContent = 'ℹ 조금 길어요 · 핵심만 남기세요';
      readabilityHint.classList.add('warn');
    } else {
      readabilityHint.textContent = '✓ 가독성 좋음 · 한 화면에 깔끔히 표시';
    }
  }

  // 메시지 타입 — 우리 쿠폰 마케팅은 친구톡 텍스트형이 기본 (15원)
  // 글자수에 따른 단가 변동 없음 (1,000자까지 동일)
  // 가독성 경고만 표시
  const unitCost = 15;  // 친구톡 텍스트형 (광고성 메시지)
  const msgType = '친구톡(브랜드메시지)';
  let statusClass = 'ok', statusIcon = '✓', statusText = `${msgType} · ${unitCost}원/건`;

  if (len > 800) {
    statusClass = 'warn';
    statusIcon = '⚠';
    statusText = `${msgType} · ${unitCost}원/건 · 한도 근접 (1,000자)`;
  } else if (len > 80) {
    statusClass = 'neutral';
    statusIcon = 'ℹ';
    statusText = `${msgType} · ${unitCost}원/건 · 80자 권장`;
  }

  const statusEl = document.getElementById('admin-msg-status');
  const statusTextEl = document.getElementById('admin-msg-status-text');
  if (statusEl) {
    statusEl.classList.remove('ok', 'warn', 'danger', 'neutral');
    statusEl.classList.add(statusClass);
    statusEl.querySelector('.msg-cost-icon').textContent = statusIcon;
  }
  if (statusTextEl) statusTextEl.textContent = statusText;

  // 발송 대상 수 추정
  let recipients = 0;
  try {
    if (typeof getTargetMembers === 'function') {
      recipients = getTargetMembers(draft.target, draft.subFilter, draft.baseCoupon).length;
    }
  } catch(e) {}
  const totalCost = recipients * unitCost;

  const estCount = document.getElementById('admin-msg-estimate-count');
  if (estCount) estCount.textContent = recipients.toLocaleString() + '건';
  const estCost = document.getElementById('admin-msg-estimate-cost');
  if (estCost) estCost.textContent = totalCost.toLocaleString() + '원';
}

// ============================================
// 쿨다운 카운트다운 ticker
// ============================================
let cooldownTickerInterval = null;
function startCooldownTicker() {
  if (cooldownTickerInterval) return;
  cooldownTickerInterval = setInterval(() => {
    if (state.screen !== 'main' || state.mode !== 'customer') return;
    let needsRerender = false;
    document.querySelectorAll('[data-cooldown-id]').forEach(el => {
      const id = el.dataset.cooldownId;
      const ms = getCouponCooldown(id);
      if (ms <= 0) {
        needsRerender = true; // 쿨다운 끝 → 카드 다시 활성화
      } else {
        el.textContent = formatCooldown(ms);
      }
    });
    if (needsRerender) {
      const scroll = window.scrollY;
      render();
      window.scrollTo({ top: scroll });
      toast('🔓 쿠폰이 다시 사용 가능해졌어요!');
    }
    if (!hasActiveCooldowns()) stopCooldownTicker();
  }, 1000);
}
function stopCooldownTicker() {
  if (cooldownTickerInterval) { clearInterval(cooldownTickerInterval); cooldownTickerInterval = null; }
}

// ============================================
// TIMER
// ============================================
function startTimer() {
  stopTimer();
  state.timer = setInterval(() => {
    state.secondsLeft -= 1;
    if (state.secondsLeft <= 0) {
      stopTimer();
      state.screen = 'expired';
      render();
      return;
    }
    if (state.screen === 'coupon') render();
  }, 1000);
}
function stopTimer() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

function openCancelConfirmModal() {
  const html = `
    <div class="modal-backdrop show" id="modal-bg">
      <div class="modal" style="text-align: center;">
        <div class="modal-handle"></div>
        <div style="width: 64px; height: 64px; background: #FEE2E2; color: #DC2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 8px auto 16px;">⚠</div>
        <div class="modal-title" style="text-align: center;">쿠폰을 취소하시겠어요?</div>
        <div class="modal-desc" style="text-align: center;">
          돌아가면 발급된 시리얼번호는<br/>
          <b>사용 처리되어 복구되지 않습니다</b>
        </div>
        <div class="modal-actions" style="margin-top: 8px;">
          <button class="btn-modal-secondary" id="cancel-no" style="flex: 1;">계속 사용</button>
          <button class="btn-modal-primary" id="cancel-yes" style="background: #DC2626; color: white; box-shadow: 0 6px 18px rgba(220,38,38,0.40);">취소하고 나가기</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  const bg = document.getElementById('modal-bg');
  const close = () => bg.remove();
  document.getElementById('cancel-no').addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.getElementById('cancel-yes').addEventListener('click', () => {
    close();
    stopTimer();
    state.activeSerial = null;
    state.selectedCampaign = null;
    state.screen = 'main';
    render();
  });
}

  // 카톡 연동된 회원만 로그인 가능
  const eligibleMembers = MEMBERS.filter(m => m.kakaoConnected);
  if (eligibleMembers.length === 0) {
    toast('가입된 회원이 없어요. 먼저 가입해주세요');
    return;
  }

  const html = `
    <div class="modal-backdrop show" id="modal-bg">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="kakao-auth-icon-big">💬</div>
        <div class="modal-title" style="text-align: center;">카카오톡으로 로그인</div>
        <div class="modal-desc" style="text-align: center;">
          이미 가입된 카카오 계정으로<br/>
          <b>1초 만에 로그인</b>됩니다
        </div>

        <div class="login-demo-hint">
          <div class="login-demo-hint-icon">📌</div>
          <div class="login-demo-hint-text">
            <div class="login-demo-hint-title">데모 모드</div>
            <div class="login-demo-hint-desc">실서비스에서는 카카오 SSO로 자동 인증되지만, 데모는 회원을 선택해주세요</div>
          </div>
        </div>

        <div class="login-member-list">
          ${eligibleMembers.map(m => {
            const pushedCount = getPushedCampaignsForMember(m).length;
            const usageCount = m.usageHistory?.length || 0;
            return `
              <div class="login-member-card" data-phone="${m.phone}">
                <div class="login-member-avatar">${(m.kakaoNickname || '?')[0]}</div>
                <div class="login-member-info">
                  <div class="login-member-name">
                    ${maskName(m.kakaoNickname)}
                    ${pushedCount > 0 ? `<span class="login-member-badge-push">🔔 ${pushedCount} NEW</span>` : ''}
                  </div>
                  <div class="login-member-meta">${m.gender === 'M' ? '남' : '여'} · ${m.age}세 · 발급 ${usageCount}건</div>
                </div>
                <div class="login-member-arrow">→</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="modal-actions">
          <button class="btn-modal-secondary" id="login-cancel" style="flex: 1;">취소</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  const bg = document.getElementById('modal-bg');
  const close = () => bg.remove();
  document.getElementById('login-cancel').addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });

  document.querySelectorAll('.login-member-card').forEach(el => {
    el.addEventListener('click', () => {
      const phone = el.dataset.phone;
      const m = MEMBERS.find(x => x.phone === phone);
      if (!m) return;
      state.member = m;
      close();
      const pushedCount = getPushedCampaignsForMember(m).length;
      if (pushedCount > 0) {
        toast(`${maskName(m.kakaoNickname)}님 환영해요! 🔔 새 쿠폰 ${pushedCount}개 도착`);
      } else {
        toast(`${maskName(m.kakaoNickname)}님 환영해요!`);
      }
      state.screen = 'main';
      render();
    });
  });
}

  // 체크박스 상태 → 동의 버튼 활성화
  function updateConfirmState() {
    let allRequired = true;
    requiredBoxes.forEach(b => { if (!b.checked) allRequired = false; });
    confirmBtn.disabled = !allRequired;

    // 부모 label에 checked 클래스 토글 (:has() 미지원 fallback)
    allBoxes.forEach(b => {
      const label = b.closest('.perm-clickable');
      if (label) label.classList.toggle('checked', b.checked);
    });

    // 전체 동의 상태
    let allChecked = true;
    allBoxes.forEach(b => { if (!b.checked) allChecked = false; });
    allBtn.classList.toggle('all-checked', allChecked);
  }
  allBoxes.forEach(b => b.addEventListener('change', updateConfirmState));
  // 마케팅 기본 체크 상태를 시각에 즉시 반영
  updateConfirmState();

  // 전체 동의 버튼
  allBtn.addEventListener('click', () => {
    const allChecked = Array.from(allBoxes).every(b => b.checked);
    allBoxes.forEach(b => { b.checked = !allChecked; });
    updateConfirmState();
  });

  const close = () => bg.remove();
  document.getElementById('kakao-cancel').addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });

  confirmBtn.addEventListener('click', () => {

}

    persistMember(state.member);

    }
    state.screen = 'main';
    render();
  });
}

// === 회원 영속화 (localStorage) ===
const MEMBER_STORAGE_KEY = 'zerolab_member_v1';
function persistMember(member) {
  try {
    if (member) {
      localStorage.setItem(MEMBER_STORAGE_KEY, JSON.stringify(member));
    } else {
      localStorage.removeItem(MEMBER_STORAGE_KEY);
    }
  } catch(e) { console.warn('localStorage write failed:', e); }
}
function loadMember() {
  try {
    const saved = localStorage.getItem(MEMBER_STORAGE_KEY);
    if (!saved) return null;
    const m = JSON.parse(saved);
    if (!m || !m.phone) return null;
    return m;
  } catch(e) { return null; }
}
function logoutMember() {
  state.member = null;
  persistMember(null);
  toast('로그아웃되었습니다');
  state.screen = 'welcome';
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// 점주 모드 보안 진입 (URL ?role=owner + 비밀번호)
// 임시 조치 — M3에서 store.zerolab.kr 정식 분리 시 대체
// v44: 인증된 세션에서 자동으로 양방향 토글 활성화 (시연 편의)
// ============================================
(function ownerModeEntry() {
  try {
    const params = new URLSearchParams(window.location.search);
    const sessionAuth = sessionStorage.getItem('zerolab_owner_auth');

    // v44: 인증된 세션이 살아있으면 → URL에 role=owner 없어도 토글 버튼 활성화
    // (시연 중 점주 ↔ 손님 자유 전환)
    if (sessionAuth === 'authorized') {
      document.body.classList.add('admin-enabled');
      // role=owner URL로 진입한 경우만 점주 모드로 시작
      if (params.get('role') === 'owner') {
        state.mode = 'admin';
      }
      return;
    }

    // role=owner URL 진입 시에만 비밀번호 프롬프트
    if (params.get('role') !== 'owner') return;

    // 비밀번호 입력
    const STORE_PASSWORD = 'zero-store-2026'; // ⚠️ M3에서 매장별 비밀번호로 변경
    const pw = prompt('🔒 점주 모드 진입\n\n점주 비밀번호를 입력해주세요');

    if (pw === STORE_PASSWORD) {
      sessionStorage.setItem('zerolab_owner_auth', 'authorized');
      document.body.classList.add('admin-enabled');  // v44: 토글 버튼 활성화
      state.mode = 'admin';
      console.log('[ZeroLab] 점주 모드 진입 (양방향 토글 활성화)');
    } else if (pw !== null) {
      alert('비밀번호가 올바르지 않습니다.\n본사에 문의해주세요.');
      // URL 파라미터 제거 (재시도 차단)
      const url = new URL(window.location.href);
      url.searchParams.delete('role');
      window.history.replaceState({}, '', url.toString());
    }
  } catch(e) { console.error(e); }
})();

(function securityGuard() {
  try {
    // 우클릭 차단
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    // 키보드 단축키 차단 (F12, Ctrl+U, Ctrl+S, Ctrl+Shift+I/J/C)
    document.addEventListener('keydown', (e) => {
      // F12
      if (e.key === 'F12') {
        e.preventDefault();
        return false;
      }
      // Ctrl+U (소스 보기)
      if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+S (저장)
      if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+I/J/C (개발자 도구)
      if (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)) {
        e.preventDefault();
        return false;
      }
    });

    // 텍스트/이미지 드래그 차단
    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
      return false;
    });
    document.addEventListener('selectstart', (e) => {
      // 입력 필드는 허용
      const target = e.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
        return;
      }
      e.preventDefault();
      return false;
    });

    // 콘솔 경고 (호기심 차단)
    setTimeout(() => {
      try {
        const style1 = 'color:#DC2626;font-size:24px;font-weight:900;';
        const style2 = 'color:#181600;font-size:13px;font-weight:600;line-height:1.5;';
        console.log('%c⚠️ 잠깐!', style1);
        console.log('%c여기는 개발자 도구입니다.\n타인의 카카오 계정 정보를 입력하라는 안내를 받으셨다면\n100% 사기입니다. 절대 입력하지 마세요.\n\n— ZERO 연구소', style2);
      } catch(e) {}
    }, 500);
  } catch(e) { /* 안전 무시 */ }
})();

render();
</script>
</body>
</html>
